{% extends "base.html" %}
{% block content %}
<div class="container">
    <header class="hero" style="margin-bottom: 30px;">
        <h1 style="font-size:3rem;">Your <span class="gradient-text">Library</span></h1>
        <p>Automations you own and can deploy right now into the Command Center.</p>
    </header>
    <div class="features-grid">
        <div class="glass-card" style="border-color:#03dac6; position:relative; overflow:hidden;">
            <div style="position:absolute; top:0; right:0; background:#03dac6; color:#000; padding:5px 15px; font-weight:800; font-size:0.8rem; border-bottom-left-radius: 12px;">Active</div>
            <h3 style="margin-bottom:10px;">AI Reaction Analyzer</h3>
            <p style="color:#a5a5a5; font-size:0.9rem; margin-bottom:20px;">Scrape, analyze, and generate outreach.</p>
            <a href="/dashboard" class="action-btn" style="display:block; text-align:center; width:100%; padding: 15px;">Launch Target Sequence</a>
        </div>
        <div class="glass-card" style="opacity: 0.6; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:200px;">
            <p style="color:#a5a5a5; font-size:0.9rem; margin-bottom:20px;">Ready for more growth?</p>
            <a href="/marketplace" class="nav-btn" style="display:block; text-align:center; width:100%;">Visit Marketplace</a>
        </div>
    </div>
</div>
{% endblock %}
