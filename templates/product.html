{% extends "base.html" %}
{% block content %}
<div class="container" style="display:flex; gap:40px; align-items:flex-start;">
    <div style="flex:1;">
        <img src="{{ product.img }}" style="width:100%; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);" alt="Product Image">
    </div>
    <div style="flex:1;" class="glass-card">
        <h1 style="font-size:2.5rem; margin-bottom:10px;">{{ product.name }}</h1>
        <p style="color:#bb86fc; font-weight:600; margin-bottom:20px;">Creator: {{ product.author }}</p>
        <p style="color:#a5a5a5; line-height:1.6; margin-bottom:30px; font-size:1.1rem;">{{ product.desc }} Deploy this module directly into your Command Center and watch your LinkedIn growth skyrocket.</p>
        <div style="font-size:3rem; font-weight:800; color:#03dac6; margin-bottom:30px;">{{ product.price }}</div>
        <a href="/library" class="action-btn" style="display:block; text-align:center; width:100%; font-size:1.5rem; padding: 20px;">Purchase & Add to Library</a>
    </div>
</div>
{% endblock %}
